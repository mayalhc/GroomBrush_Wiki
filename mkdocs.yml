# 사이트 설정
site_name: GroomBrush — User Guide
site_url: https://mayalhc.github.io/GroomBrush_Wiki/
site_author: chamiseul
site_description: Groom Brush — hair brushes for Unreal Engine 5.8 grooms, in the level editor viewport

# 테마 설정 (다른 가이드와 같은 readthedocs 테마)
theme:
  name: readthedocs
  highlightjs: true
  collapse_navigation: false # 전체를 항상 펼침
  sticky_navigation: true
  navigation_depth: 4
  titles_only: false

extra_css:
  - custom.css

# 네비게이션 (메뉴 구조)
nav:
  - GroomBrush Guide:
    - "Welcome to GroomBrush": index.md
    - "한국어 가이드": KO_index.md
  - "All add-ons & guides": https://mayalhc.github.io/guides/

# 마크다운 확장 기능
markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
